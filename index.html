<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>STUDIO IKERU</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDIO IKERU">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080808;font-family:'Noto Sans JP',sans-serif;color:#EDE8DC}
input,button{font-family:'Noto Sans JP',sans-serif}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState}=React;
const TODAY="2026-05-12";
const STUDIOS=["STUDIO A","STUDIO B","STUDIO C"];
const BK=[
{id:1,studio:"STUDIO A",customer:"田中 美咲",date:"2026-05-12",start:"10:00",end:"13:00",price:15000,status:"confirmed"},
{id:2,studio:"STUDIO B",customer:"鈴木 健太",date:"2026-05-12",start:"14:00",end:"17:00",price:18000,status:"confirmed"},
{id:3,studio:"STUDIO A",customer:"山田 花子",date:"2026-05-13",start:"09:00",end:"12:00",price:15000,status:"confirmed"},
{id:4,studio:"STUDIO C",customer:"佐藤 拓也",date:"2026-05-13",start:"15:00",end:"18:00",price:12000,status:"pending"},
{id:5,studio:"STUDIO B",customer:"渡辺 彩",date:"2026-05-14",start:"11:00",end:"14:00",price:18000,status:"confirmed"},
{id:6,studio:"STUDIO A",customer:"高橋 誠",date:"2026-05-15",start:"13:00",end:"16:00",price:15000,status:"confirmed"},
{id:7,studio:"STUDIO C",customer:"伊藤 りか",date:"2026-05-16",start:"10:00",end:"13:00",price:12000,status:"pending"},
{id:8,studio:"STUDIO B",customer:"木村 悠",date:"2026-05-17",start:"09:00",end:"12:00",price:18000,status:"confirmed"},
];
const CS=[
{id:1,name:"田中 美咲",phone:"090-1234-5678",email:"tanaka@example.com",visits:8,totalSpent:120000,note:"ダンス系。早朝希望多め。"},
{id:2,name:"鈴木 健太",phone:"080-2345-6789",email:"suzuki@example.com",visits:5,totalSpent:90000,note:"バンド練習。機材持込あり。"},
{id:3,name:"山田 花子",phone:"090-3456-7890",email:"yamada@example.com",visits:12,totalSpent:180000,note:"ヨガインストラクター。リピーター。"},
{id:4,name:"佐藤 拓也",phone:"080-4567-8901",email:"sato@example.com",visits:3,totalSpent:36000,note:""},
{id:5,name:"渡辺 彩",phone:"090-5678-9012",email:"watanabe@example.com",visits:7,totalSpent:126000,note:"撮影利用。照明機材あり。"},
];
const MR=[{month:"1月",revenue:285000},{month:"2月",revenue:320000},{month:"3月",revenue:415000},{month:"4月",revenue:380000},{month:"5月",revenue:195000}];
const C={bg:"#080808",card:"#131313",card2:"#1A1A1A",border:"#222",gold:"#C8A46A",goldDim:"#C8A46A33",text:"#EDE8DC",sub:"#6B6560",green:"#4BA882",greenDim:"#4BA88222",red:"#D95050",redDim:"#D9505022",blue:"#5B9BD5",purple:"#9B7BC4"};
const SC={"STUDIO A":C.gold,"STUDIO B":C.blue,"STUDIO C":C.purple};
const e=React.createElement;

function Badge({status}){
  return e('span',{style:{fontSize:10,padding:'3px 8px',borderRadius:6,fontWeight:700,background:status==='confirmed'?C.greenDim:C.goldDim,color:status==='confirmed'?C.green:C.gold}},status==='confirmed'?'確定':'仮予約');
}
function Card({children,style,onClick}){
  return e('div',{onClick,style:{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:'14px 16px',marginBottom:8,cursor:onClick?'pointer':'default',...(style||{})}},children);
}
function Label({children}){
  return e('div',{style:{fontSize:10,color:C.sub,letterSpacing:2,marginBottom:10,textTransform:'uppercase'}},children);
}
function BookingCard({b}){
  return e(Card,{style:{borderLeft:`3px solid ${SC[b.studio]}`}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
      e('div',null,
        e('div',{style:{fontSize:10,color:SC[b.studio],letterSpacing:1.5,marginBottom:4}},b.studio),
        e('div',{style:{fontSize:16,fontWeight:700,color:C.text}},b.customer),
        e('div',{style:{fontSize:12,color:C.sub,marginTop:3}},b.start+' – '+b.end)
      ),
      e('div',{style:{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}},
        e('div',{style:{fontSize:16,fontWeight:800,color:C.gold}},'¥'+b.price.toLocaleString()),
        e(Badge,{status:b.status})
      )
    )
  );
}
function SecurityWidget({armed,onToggle}){
  return e('div',{style:{background:armed?C.redDim:C.greenDim,border:`1px solid ${armed?C.red:C.green}`,borderRadius:16,padding:'18px 20px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between'}},
    e('div',null,
      e('div',{style:{fontSize:10,color:C.sub,letterSpacing:2,marginBottom:6}},'SECOM セキュリティ'),
      e('div',{style:{fontSize:22,fontWeight:800,color:armed?C.red:C.green,marginBottom:4}},armed?'🔒 警戒中':'🔓 解除中'),
      e('div',{style:{fontSize:11,color:C.sub}},armed?'施設は警戒中です':'入室可能な状態です')
    ),
    e('button',{onClick:onToggle,style:{background:armed?C.red:C.green,color:'#fff',border:'none',borderRadius:12,padding:'10px 16px',fontSize:12,fontWeight:800,cursor:'pointer',flexShrink:0}},armed?'解除する':'警戒する')
  );
}
function HomeScreen({bookings,armed,onToggle}){
  const tBK=bookings.filter(b=>b.date===TODAY);
  const tRev=tBK.filter(b=>b.status==='confirmed').reduce((s,b)=>s+b.price,0);
  const mBK=bookings.filter(b=>b.date.startsWith('2026-05'));
  const mRev=mBK.filter(b=>b.status==='confirmed').reduce((s,b)=>s+b.price,0);
  return e('div',{style:{padding:'0 16px 100px'}},
    e(SecurityWidget,{armed,onToggle}),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:20}},
      [{label:'今日の予約',value:tBK.length+'件'},{label:'今日の売上',value:'¥'+tRev.toLocaleString()},{label:'今月の予約',value:mBK.length+'件'},{label:'今月の売上',value:'¥'+mRev.toLocaleString()}].map((s,i)=>
        e(Card,{key:i,style:{textAlign:'center',padding:'16px 12px'}},
          e('div',{style:{fontSize:10,color:C.sub,marginBottom:8}},s.label),
          e('div',{style:{fontSize:i<2?18:15,fontWeight:800,color:C.gold}},s.value)
        )
      )
    ),
    e(Label,null,"TODAY'S SCHEDULE"),
    tBK.length>0?tBK.map(b=>e(BookingCard,{key:b.id,b})):e(Card,{style:{textAlign:'center',padding:28,color:C.sub,fontSize:13}},'本日の予約はありません')
  );
}
function CalendarScreen({bookings}){
  const[selDate,setSelDate]=useState(TODAY);
  const[month,setMonth]=useState(new Date(2026,4,1));
  const y=month.getFullYear(),m=month.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const fd=new Date(y,m,1).getDay();
  const fmt=d=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const selBK=bookings.filter(b=>b.date===selDate);
  return e('div',{style:{padding:'0 16px 100px'}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
      e('button',{onClick:()=>setMonth(new Date(y,m-1,1)),style:{background:C.card,border:`1px solid ${C.border}`,color:C.text,borderRadius:10,padding:'8px 16px',fontSize:16,cursor:'pointer'}},'‹'),
      e('span',{style:{fontSize:16,fontWeight:700,color:C.text}},y+'年'+(m+1)+'月'),
      e('button',{onClick:()=>setMonth(new Date(y,m+1,1)),style:{background:C.card,border:`1px solid ${C.border}`,color:C.text,borderRadius:10,padding:'8px 16px',fontSize:16,cursor:'pointer'}},'›')
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:4}},
      ['日','月','火','水','木','金','土'].map((d,i)=>e('div',{key:d,style:{textAlign:'center',fontSize:11,padding:'4px 0',color:i===0?C.red:i===6?C.blue:C.sub}},d))
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:20}},
      [...Array(fd)].map((_,i)=>e('div',{key:'e'+i})),
      [...Array(dim)].map((_,i)=>{
        const d=i+1,ds=fmt(d),isSel=ds===selDate,isTod=ds===TODAY;
        const cnt=bookings.filter(b=>b.date===ds).length;
        return e('div',{key:d,onClick:()=>setSelDate(ds),style:{textAlign:'center',padding:'7px 2px',borderRadius:9,cursor:'pointer',background:isSel?C.gold:'transparent',border:isTod&&!isSel?`1.5px solid ${C.gold}`:'1.5px solid transparent'}},
          e('div',{style:{fontSize:13,color:isSel?'#000':C.text,fontWeight:isTod?800:400}},d),
          cnt>0&&e('div',{style:{display:'flex',justifyContent:'center',gap:2,marginTop:3}},
            [...Array(Math.min(cnt,3))].map((_,j)=>e('div',{key:j,style:{width:4,height:4,borderRadius:2,background:isSel?'#00000060':C.gold}}))
          )
        );
      })
    ),
    e(Label,null,selDate.replace(/-/g,'/')+'　の予約'),
    selBK.length>0?selBK.map(b=>e(BookingCard,{key:b.id,b})):e(Card,{style:{textAlign:'center',padding:24,color:C.sub,fontSize:13}},'この日の予約はありません')
  );
}
function CustomersScreen({customers}){
  const[q,setQ]=useState('');
  const[sel,setSel]=useState(null);
  const filtered=customers.filter(c=>c.name.includes(q)||c.phone.includes(q));
  if(sel){
    return e('div',{style:{padding:'0 16px 100px'}},
      e('button',{onClick:()=>setSel(null),style:{background:'none',border:'none',color:C.gold,fontSize:14,cursor:'pointer',marginBottom:16,padding:0}},'← 顧客一覧に戻る'),
      e(Card,{style:{padding:20}},
        e('div',{style:{width:56,height:56,borderRadius:28,background:C.gold,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:800,color:'#000',marginBottom:14}},sel.name[0]),
        e('div',{style:{fontSize:22,fontWeight:800,color:C.text,marginBottom:4}},sel.name),
        e('div',{style:{fontSize:13,color:C.sub,marginBottom:20}},sel.phone),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
          [{label:'来店回数',value:sel.visits+'回'},{label:'累計利用額',value:'¥'+sel.totalSpent.toLocaleString()}].map((item,i)=>
            e('div',{key:i,style:{background:C.card2,borderRadius:10,padding:'14px 12px',textAlign:'center'}},
              e('div',{style:{fontSize:10,color:C.sub,marginBottom:6}},item.label),
              e('div',{style:{fontSize:18,fontWeight:800,color:C.gold}},item.value)
            )
          )
        ),
        e('div',{style:{background:C.card2,borderRadius:10,padding:'12px 14px',marginBottom:sel.note?10:0}},
          e('div',{style:{fontSize:10,color:C.sub,marginBottom:6}},'メールアドレス'),
          e('div',{style:{fontSize:13,color:C.text}},sel.email)
        ),
        sel.note&&e('div',{style:{background:C.card2,borderRadius:10,padding:'12px 14px'}},
          e('div',{style:{fontSize:10,color:C.sub,marginBottom:6}},'メモ'),
          e('div',{style:{fontSize:13,color:C.text}},sel.note)
        )
      )
    );
  }
  return e('div',{style:{padding:'0 16px 100px'}},
    e('input',{placeholder:'🔍  名前・電話番号で検索',value:q,onChange:ev=>setQ(ev.target.value),style:{width:'100%',background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:'13px 14px',fontSize:14,color:C.text,outline:'none',boxSizing:'border-box',marginBottom:14}}),
    filtered.map(c=>e(Card,{key:c.id,onClick:()=>setSel(c)},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:12}},
          e('div',{style:{width:40,height:40,borderRadius:20,background:C.goldDim,border:`1px solid ${C.gold}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:800,color:C.gold,flexShrink:0}},c.name[0]),
          e('div',null,
            e('div',{style:{fontSize:15,fontWeight:700,color:C.text}},c.name),
            e('div',{style:{fontSize:12,color:C.sub,marginTop:2}},c.phone)
          )
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontSize:14,fontWeight:800,color:C.gold}},'¥'+c.totalSpent.toLocaleString()),
          e('div',{style:{fontSize:11,color:C.sub}},c.visits+'回')
        )
      )
    ))
  );
}
function RevenueScreen({bookings}){
  const conf=bookings.filter(b=>b.status==='confirmed');
  const moRev=conf.filter(b=>b.date.startsWith('2026-05')).reduce((s,b)=>s+b.price,0);
  const maxR=Math.max(...MR.map(m=>m.revenue));
  const total=conf.reduce((s,b)=>s+b.price,0)||1;
  return e('div',{style:{padding:'0 16px 100px'}},
    e(Card,{style:{padding:22,marginBottom:16}},
      e(Label,null,'2026年5月 売上合計'),
      e('div',{style:{fontSize:36,fontWeight:900,color:C.gold,letterSpacing:-1}},'¥'+moRev.toLocaleString()),
      e('div',{style:{fontSize:12,color:C.sub,marginTop:6}},'確定: '+conf.filter(b=>b.date.startsWith('2026-05')).length+'件　仮予約: '+bookings.filter(b=>b.date.startsWith('2026-05')&&b.status==='pending').length+'件')
    ),
    e(Label,null,'月次推移'),
    e(Card,{style:{padding:'20px 16px 16px',marginBottom:16}},
      e('div',{style:{display:'flex',alignItems:'flex-end',gap:8,height:90}},
        MR.map((m,i)=>{
          const h=Math.round((m.revenue/maxR)*80),cur=i===MR.length-1;
          return e('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}},
            e('div',{style:{fontSize:10,color:C.sub}},'¥'+Math.round(m.revenue/10000)+'万'),
            e('div',{style:{width:'100%',height:h,background:cur?C.goldDim:C.gold,border:cur?`1.5px dashed ${C.gold}`:'none',borderRadius:'5px 5px 0 0'}}),
            e('div',{style:{fontSize:10,color:cur?C.gold:C.sub,fontWeight:cur?800:400}},m.month)
          );
        })
      )
    ),
    e(Label,null,'スタジオ別'),
    STUDIOS.map((studio,i)=>{
      const rev=conf.filter(b=>b.studio===studio).reduce((s,b)=>s+b.price,0);
      const cnt=conf.filter(b=>b.studio===studio).length;
      const color=SC[studio];
      const pct=Math.round((rev/total)*100);
      return e(Card,{key:i,style:{borderLeft:`3px solid ${color}`}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
          e('div',null,
            e('div',{style:{fontSize:11,color,letterSpacing:1.5,marginBottom:2}},studio),
            e('div',{style:{fontSize:12,color:C.sub}},cnt+'件')
          ),
          e('div',{style:{fontSize:20,fontWeight:800,color:C.text}},'¥'+rev.toLocaleString())
        ),
        e('div',{style:{background:C.card2,borderRadius:4,height:4,overflow:'hidden'}},
          e('div',{style:{height:'100%',width:pct+'%',background:color,borderRadius:4}})
        )
      );
    })
  );
}
function SettingsScreen(){
  const staff=[{name:'山本 太郎',role:'管理者 (オーナー)',color:C.gold},{name:'中村 さくら',role:'スタッフ',color:C.sub},{name:'小林 大介',role:'スタッフ',color:C.sub}];
  return e('div',{style:{padding:'0 16px 100px'}},
    e(Label,null,'スタッフ管理'),
    staff.map((s,i)=>e(Card,{key:i},
      e('div',{style:{display:'flex',alignItems:'center',gap:12}},
        e('div',{style:{width:44,height:44,borderRadius:22,background:s.color+'22',border:`1px solid ${s.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,fontWeight:800,color:s.color,flexShrink:0}},s.name[0]),
        e('div',null,
          e('div',{style:{fontSize:15,fontWeight:700,color:C.text}},s.name),
          e('div',{style:{fontSize:11,color:s.color,marginTop:2}},s.role)
        )
      )
    )),
    e('div',{style:{marginTop:8}},
      e(Label,null,'スタジオ設定'),
      STUDIOS.map((studio,i)=>e(Card,{key:i,style:{borderLeft:`3px solid ${SC[studio]}`,display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('span',{style:{fontSize:13,fontWeight:700,color:SC[studio]}},studio),
        e('span',{style:{fontSize:11,color:C.sub}},'設定を編集 ›')
      ))
    ),
    e('div',{style:{marginTop:8}},
      e(Label,null,'アプリについて'),
      e(Card,null,
        e('div',{style:{fontSize:13,color:C.sub,lineHeight:2.2}},
          e('div',null,'アプリ名: STUDIO IKERU'),
          e('div',null,'運営: 株式会社IKERU'),
          e('div',null,'バージョン: 1.0.0')
        )
      )
    )
  );
}
const TABS=[{id:'home',label:'ホーム',emoji:'🏠'},{id:'calendar',label:'カレンダー',emoji:'📅'},{id:'customers',label:'顧客',emoji:'👥'},{id:'revenue',label:'売上',emoji:'📊'},{id:'settings',label:'設定',emoji:'⚙️'}];
function App(){
  const[tab,setTab]=useState('home');
  const[armed,setArmed]=useState(false);
  const[bookings]=useState(BK);
  const[customers]=useState(CS);
  return e('div',{style:{background:C.bg,minHeight:'100dvh',fontFamily:"'Noto Sans JP',sans-serif",maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column',color:C.text}},
    e('div',{style:{padding:'20px 20px 14px',borderBottom:`1px solid ${C.border}`,background:C.bg,position:'sticky',top:0,zIndex:100}},
      e('div',{style:{fontSize:9,color:C.sub,letterSpacing:3,marginBottom:3,textTransform:'uppercase'}},'株式会社 IKERU'),
      e('div',{style:{fontSize:21,fontWeight:900,color:C.gold,letterSpacing:2}},'STUDIO IKERU')
    ),
    e('div',{style:{flex:1,overflowY:'auto',paddingTop:16}},
      tab==='home'&&e(HomeScreen,{bookings,armed,onToggle:()=>setArmed(p=>!p)}),
      tab==='calendar'&&e(CalendarScreen,{bookings}),
      tab==='customers'&&e(CustomersScreen,{customers}),
      tab==='revenue'&&e(RevenueScreen,{bookings}),
      tab==='settings'&&e(SettingsScreen)
    ),
    e('div',{style:{display:'flex',background:C.card,borderTop:`1px solid ${C.border}`,padding:'10px 0 22px',position:'sticky',bottom:0}},
      TABS.map(item=>e('button',{key:item.id,onClick:()=>setTab(item.id),style:{flex:1,background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'4px 0'}},
        e('div',{style:{fontSize:20,filter:tab===item.id?'none':'grayscale(1) opacity(0.35)'}},item.emoji),
        e('div',{style:{fontSize:9,color:tab===item.id?C.gold:C.sub,fontWeight:tab===item.id?800:400,letterSpacing:0.5}},item.label),
        tab===item.id&&e('div',{style:{width:16,height:2,borderRadius:1,background:C.gold}})
      ))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));
</script>
</body>
</html>
